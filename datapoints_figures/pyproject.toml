[project]
name = "datapoints-figures"
version = "0.1.0"
description = "Manuscript matplotlib style, palette, and layout helpers for Datapoints figures"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
plots = [
    "pandas>=2",
    "seaborn>=0.13",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapoints_figures"]

[tool.hatch.build.targets.wheel.sources]
"src/datapoints_figures" = "datapoints_figures"

[tool.hatch.build.targets.wheel.force-include]
"src/datapoints_figures/fonts" = "datapoints_figures/fonts"

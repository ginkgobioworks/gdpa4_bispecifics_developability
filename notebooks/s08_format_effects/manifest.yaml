section: s08_format_effects
purpose: >
  Decompose bispecific-vs-mean(parents) residuals into per-Fv format effects
  to identify antibody variable regions that systematically behave poorly
  or well in bispecific context.

consumes:
  - data/processed/03_aggregated/n3n4_per_antibody.parquet
  - data/processed/02_joined/n3_components.parquet

produces:
  - reports/figures/s08_parent_graph.png
  - reports/figures/s08_degree_distribution.png
  - reports/figures/s08_residual_strips.png
  - reports/figures/s08_coefficient_forest.png
  - reports/figures/s08_coefficient_heatmap.png
  - reports/figures/s08_residual_strips_reported_subset.png
  - reports/figures/s08_coefficient_forest_reported_subset.png
  - reports/figures/s08_coefficient_heatmap_reported_subset.png
  - reports/tables/s08_format_effect_coefficients.csv

decisions:
  - id: D-2026-05-05-FORMAT-EFFECTS
    note: OLS model bs_ab = mean(a,b) + bs_a + bs_b decomposes format effects per Fv.
  - id: D-2026-05-05-MIN-DEGREE
    note: Only Fvs with degree >= MIN_DEGREE in the parent graph are modeled.

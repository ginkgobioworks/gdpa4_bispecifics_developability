section: s02_cross_platform
purpose: >
  Compare per-antibody summaries from this campaign (N4 monospecifics) against
  the published GDPa1 measurements for the same molecules. Produces per-assay
  Spearman correlations and a small-multiples scatter plot.

consumes:
  - data/processed/03_aggregated/n3n4_per_antibody.parquet
  - data/processed/03_aggregated/gdpa1_per_antibody.parquet
  - data/processed/02_joined/n4_gdpa1_map.parquet

produces:
  - reports/figures/s02_cross_platform_scatter.png
  - reports/tables/s02_cross_platform_correlations.csv

decisions:
  - id: D-2026-04-27-AC-SINS
    note: His/Arg pH 6 only; His/NaCl excluded from cross-platform comparison.
  - id: D-2026-04-27-PR-V2
    note: pr_score (raw) is the GDPa1 polyreactivity comparator (supersedes D-2026-04-27-PR).
  - id: D-2026-04-27-AGG
    note: Median across replicates is the per-antibody comparator on both sides.
  - id: D-2026-05-08-DROP-SEC-THERMO
    note: SEC %monomer and thermostability (Tm1, Tm2, Tonset) removed from cross-platform comparison.
  - id: D-2026-05-08-GDPA1-IGG1
    note: GDPa1 filtered to IgG1 antibodies only for like-for-like comparison.

section: s07_loo_models
purpose: >
  Visualize the per-N3 leave-one-out CV sweep produced by stage 05
  (D-2026-04-30-CV-LOO-PARENT-DISJOINT). Mirrors s05's figures and tables
  but reads the _loo parquets, and adds a side-by-side comparison of
  LOO Spearman ρ vs the parent-aware 5-fold ρ for the same
  (label × config × model) combos.

consumes:
  - data/processed/05_modeling/cv_metrics_loo.parquet
  - data/processed/05_modeling/cv_oof_predictions_loo.parquet
  - data/processed/05_modeling/cv_metrics.parquet
  - data/processed/05_modeling/feature_importance_long.parquet


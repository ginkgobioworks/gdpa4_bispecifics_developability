decisions:
  - id: D-2026-04-30-CV-LOO-PARENT-DISJOINT
    note: Per-N3 LOO with parent exclusion; full 160-N3 panel coverage.
  - id: D-2026-04-27-CV-PARENTAWARE
    note: Source of the k-fold ρ values used by s07_loo_vs_kfold_scatter.
  - id: D-2026-04-27-MODELS
    note: Ridge, Lasso, ElasticNet, RF, XGBoost, HGBM, PLS model families.
  - id: D-2026-04-29-TARGET-TRANSFORMS
    note: Per-label target transforms applied at fit time; OOF predictions are on the original scale.
  - id: D-2026-04-27-IMPORTANCE
    note: Built-in + permutation importance from full-data refit (split-agnostic); reused from s05/s06 pipeline.

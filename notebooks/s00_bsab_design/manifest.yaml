  - reports/figures/s00_strat2_avg_computed.png
  - reports/figures/s00_strat2_avg_moe.png
  - reports/figures/s00_strat2_diff_assays.png
  - reports/figures/s00_strat2_diff_computed.png
  - reports/figures/s00_strat2_diff_moe.png
  - reports/figures/s00_mw_differences.png
  - reports/figures/s00_arm_distribution.png

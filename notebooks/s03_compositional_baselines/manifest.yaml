section: s03_compositional_baselines
purpose: >
  Predict each N3 property from the two N4 parents using mean/min/max/geomean.
consumes:
  - data/processed/03_aggregated/n3n4_per_antibody.parquet
  - data/processed/02_joined/n3_components.parquet
produces:
  - data/processed/04_features/n3_compositional_predictions.parquet
  - reports/figures/s03_baseline_scatter.png
  - reports/figures/s03_baseline_scatter_reported_subset.png
  - reports/figures/s03_operator_vs_absdiff_threshold_reported_subset.png
  - reports/tables/s03_baseline_metrics.csv

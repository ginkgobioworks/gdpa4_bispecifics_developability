section: s01_data_overview
purpose: >
  Sanity-check the stage-01 normalized parquets and report basic counts,
  coverage, and replicate structure. Produces the dataset-overview figure
  and table used in the manuscript's Methods/Data section.

consumes:
  - data/processed/01_normalized/n3n4_long.parquet
  - data/processed/01_normalized/gdpa1_tidy.parquet
  - data/processed/01_normalized/n3_production.parquet
  - data/processed/01_normalized/n4_production.parquet
  - data/processed/03_aggregated/n3n4_per_antibody.parquet

produces:
  - reports/figures/s01_assay_coverage.png
  - reports/tables/s01_replicate_counts.csv
  - reports/figures/s01_dist_ac_sins.png
  - reports/figures/s01_dist_bvp.png
  - reports/figures/s01_dist_hplc_hac.png
  - reports/figures/s01_dist_hplc_hic.png
  - reports/figures/s01_dist_hplc_sec.png
  - reports/figures/s01_dist_hplc_smac.png
  - reports/figures/s01_dist_intactms.png
  - reports/figures/s01_dist_pr.png
  - reports/figures/s01_dist_pts_if.png
  - reports/figures/s01_violin_pts_if.png
  - reports/figures/s01_violin_pts_if_tm_pooled.png
  - reports/figures/s01_dist_production.png
  - reports/figures/s01_correlation_heatmaps.png
  - reports/figures/s01_correlation_heatmaps_reported_subset.png
  - reports/figures/s01_swap_pair_scatters.png
  - reports/figures/s01_swap_pair_scatters_pearson.png
